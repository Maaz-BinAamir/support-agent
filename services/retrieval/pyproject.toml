[project]
name = "support-agent-retrieval"
version = "0.1.0"
description = "Local GTE embeddings and LanceDB retrieval for the support agent"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "lancedb>=0.24.3",
  "pydantic-settings>=2.10.1",
  "sentence-transformers>=5.1.0",
  "transformers>=4.57.1,<5",
  "uvicorn[standard]>=0.35.0"
]

[project.scripts]
workers-retrieval = "app.main:run"
workers-ingest = "app.ingest:main"
